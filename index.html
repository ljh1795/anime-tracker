<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的追番记录</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>我的追番记录</h1>

        <!-- 番剧列表区域 -->
        <div id="animeList"></div>

        <!-- 底部添加按钮 -->
        <div class="add-button-wrapper">
            <button id="toggleAddBtn" onclick="toggleAddForm()">+ 添加番剧</button>
        </div>

        <!-- 添加/编辑表单（默认隐藏） -->
        <div id="addForm" class="add-form hidden">
            <h2 id="formTitle">添加新番剧</h2>
            <form id="animeForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>年份：</label>
                        <select id="year" required>
                            <option value="2026">2026</option>
                            <option value="2025">2025</option>
                            <option value="2024">2024</option>
                            <option value="2023">2023</option>
                            <option value="2022">2022</option>
                            <option value="2021">2021</option>
                            <option value="2020">2020</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>季度：</label>
                        <select id="season" required>
                            <option value="春季">春季（1-3月）</option>
                            <option value="夏季">夏季（4-6月）</option>
                            <option value="秋季">秋季（7-9月）</option>
                            <option value="冬季">冬季（10-12月）</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>中文名：</label>
                    <input type="text" id="titleCn" required placeholder="例：葬送的芙莉莲">
                </div>
                <div class="form-group">
                    <label>原名（日文/英文）：</label>
                    <input type="text" id="titleOrg" placeholder="例：葬送のフリーレン">
                </div>
                <div class="form-group">
                    <label>番剧类型：</label>
                    <select id="type">
                        <option value="原创">原创</option>
                        <option value="漫改">漫改</option>
                        <option value="轻改">轻改</option>
                        <option value="游戏改">游戏改</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>话数：</label>
                        <input type="text" id="episodes" placeholder="例：28话 / 连载中">
                    </div>
                    <div class="form-group">
                        <label>状态：</label>
                        <select id="status">
                            <option value="看完">看完</option>
                            <option value="在看">在看</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>封面文件名：</label>
                    <input type="text" id="cover" placeholder="填 covers 文件夹里的文件名，如 GrandBlue.jpg">
                </div>
                <div class="form-group">
                    <label>备注：</label>
                    <textarea id="note" rows="2" placeholder="评分、观后感等"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" id="submitBtn">添加</button>
                    <button type="button" class="cancel-btn" onclick="cancelEdit()">取消</button>
                </div>
            </form>

            <!-- 数据备份区域 -->
            <div class="backup-section">
                <h3>数据备份</h3>
                <div class="backup-buttons">
                    <button type="button" class="backup-btn export-btn" onclick="exportData()">导出数据（下载备份文件）</button>
                    <button type="button" class="backup-btn import-btn" onclick="document.getElementById('importFile').click()">导入数据（选择备份文件）</button>
                    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
                    <button type="button" class="backup-btn clear-btn" onclick="clearAllData()">清空所有数据</button>
                </div>
                <p class="backup-hint">数据保存在浏览器本地。建议定期点击"导出数据"备份为文件，以防清理浏览器数据后丢失。</p>
            </div>
        </div>
    </div>

    <script>
        // 数据存储在 localStorage（浏览器本地存储）
        let animeData = JSON.parse(localStorage.getItem('animeData')) || {};
        let editingKey = null;
        let editingIndex = null;

        function saveData() {
            localStorage.setItem('animeData', JSON.stringify(animeData));
        }

        // 切换表单显示/隐藏
        function toggleAddForm() {
            const form = document.getElementById('addForm');
            form.classList.toggle('hidden');
            if (!form.classList.contains('hidden')) {
                form.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // 取消编辑
        function cancelEdit() {
            document.getElementById('animeForm').reset();
            document.getElementById('addForm').classList.add('hidden');
            editingKey = null;
            editingIndex = null;
            document.getElementById('formTitle').textContent = '添加新番剧';
            document.getElementById('submitBtn').textContent = '添加';
        }

        // 渲染番剧列表（双行对齐布局）
        function renderList() {
            const listContainer = document.getElementById('animeList');
            listContainer.innerHTML = '';

            const sortedKeys = Object.keys(animeData).sort().reverse();

            if (sortedKeys.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; padding:30px; color:#888; font-size:15px;">暂无追番记录，点击下方按钮添加吧！</p>';
                return;
            }

            sortedKeys.forEach(key => {
                const parts = key.split('-');
                const year = parts[0];
                const season = parts[1];
                const animes = animeData[key];

                const section = document.createElement('div');
                section.className = 'season-section';
                section.innerHTML = '<h2>' + year + '年 ' + season + '</h2>';

                const table = document.createElement('table');
                table.className = 'anime-table';

                animes.forEach((anime, index) => {
                    // 第一行
                    const tr1 = document.createElement('tr');
                    let coverHtml = '';
                    if (anime.cover) {
                        coverHtml = '<img src="./covers/' + anime.cover + '" alt="' + anime.titleCn + '">';
                    } else {
                        coverHtml = '<div class="no-cover">无</div>';
                    }
                    tr1.innerHTML =
                        '<td class="col-cover" rowspan="2">' + coverHtml + '</td>' +
                        '<td class="col-title-cn">' + anime.titleCn + '</td>' +
                        '<td class="col-type">' + (anime.type || '-') + '</td>' +
                        '<td class="col-episodes">' + (anime.episodes || '-') + '</td>' +
                        '<td class="col-status">' +
                            '<span class="status-badge ' + (anime.status === '看完' ? 'status-done' : 'status-watching') + '">' + anime.status + '</span>' +
                        '</td>';

                    // 第二行 - 使用模板字符串确保变量正确嵌入HTML属性
                    const tr2 = document.createElement('tr');
                    // 对key做HTML转义防止XSS
                    const safeKey = key.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    tr2.innerHTML =
                        '<td class="col-title-org">' + (anime.titleOrg || '') + '</td>' +
                        '<td class="col-note" colspan="3">' + (anime.note || '') + '</td>' +
                        '<td class="col-actions">' +
                            '<button class="btn-edit" onclick="editAnime(\'' + safeKey + '\', ' + index + ')">编辑</button>' +
                            '<button class="btn-delete" onclick="deleteAnime(\'' + safeKey + '\', ' + index + ')">删除</button>' +
                        '</td>';

                    table.appendChild(tr1);
                    table.appendChild(tr2);
                });

                section.appendChild(table);
                listContainer.appendChild(section);
            });
        }

        // 添加/更新番剧
        document.getElementById('animeForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const year = document.getElementById('year').value;
            const season = document.getElementById('season').value;
            const titleCn = document.getElementById('titleCn').value;
            const titleOrg = document.getElementById('titleOrg').value;
            const type = document.getElementById('type').value;
            const episodes = document.getElementById('episodes').value;
            const status = document.getElementById('status').value;
            const cover = document.getElementById('cover').value;
            const note = document.getElementById('note').value;

            const key = year + '-' + season;
            if (!animeData[key]) {
                animeData[key] = [];
            }

            const newAnime = { titleCn: titleCn, titleOrg: titleOrg, type: type, episodes: episodes, status: status, cover: cover, note: note };

            if (editingKey !== null && editingIndex !== null) {
                animeData[key][editingIndex] = newAnime;
            } else {
                animeData[key].push(newAnime);
            }

            saveData();
            renderList();
            cancelEdit();
        });

        // 删除番剧
        function deleteAnime(key, index) {
            if (confirm('确定要删除这部番剧吗？')) {
                animeData[key].splice(index, 1);
                if (animeData[key].length === 0) {
                    delete animeData[key];
                }
                saveData();
                renderList();
            }
        }

        // 编辑番剧
        function editAnime(key, index) {
            const anime = animeData[key][index];
            editingKey = key;
            editingIndex = index;

            document.getElementById('year').value = key.split('-')[0];
            document.getElementById('season').value = key.split('-')[1];
            document.getElementById('titleCn').value = anime.titleCn;
            document.getElementById('titleOrg').value = anime.titleOrg || '';
            document.getElementById('type').value = anime.type || '原创';
            document.getElementById('episodes').value = anime.episodes || '';
            document.getElementById('status').value = anime.status;
            document.getElementById('cover').value = anime.cover || '';
            document.getElementById('note').value = anime.note || '';

            document.getElementById('formTitle').textContent = '编辑番剧';
            document.getElementById('submitBtn').textContent = '保存';
            document.getElementById('addForm').classList.remove('hidden');
            document.getElementById('addForm').scrollIntoView({ behavior: 'smooth' });
        }

        // ====== 数据备份功能 ======

        // 导出数据：下载为 JSON 文件
        function exportData() {
            const dataStr = JSON.stringify(animeData, null, 4);
            const blob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const dateStr = new Date().toLocaleDateString('zh-CN').replace(/\//g, '-');
            a.download = '追番记录备份_' + dateStr + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            alert('数据已导出为备份文件，请妥善保存！');
        }

        // 导入数据：从 JSON 文件读取
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    for (const key in importedData) {
                        animeData[key] = importedData[key];
                    }
                    saveData();
                    renderList();
                    alert('数据导入成功！');
                } catch (err) {
                    alert('文件格式错误，请选择正确的备份文件！');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        // 清空所有数据
        function clearAllData() {
            if (confirm('确定要清空所有追番数据吗？此操作不可恢复！建议先导出数据备份。')) {
                if (confirm('再次确认：真的要删除所有数据吗？')) {
                    animeData = {};
                    localStorage.removeItem('animeData');
                    renderList();
                    alert('所有数据已清空。');
                }
            }
        }

        // 页面加载完成后渲染列表
        renderList();
    </script>
</body>
</html>
